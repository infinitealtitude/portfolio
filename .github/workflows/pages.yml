name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      allow_indexing:
        description: Allow search indexing and include a sitemap
        type: boolean
        default: false

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run check:build
        env:
          PORTFOLIO_SITE_URL: ${{ steps.pages.outputs.base_url }}
          PORTFOLIO_INDEX: ${{ inputs.allow_indexing && '1' || '0' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
